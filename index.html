<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Mi página web</title>

    <style>
        body {
            background-color: lightgreen;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: black;
            text-align: center;
        }

        p {
            font-size: 18px;
        }

        .texto-negrita {
            font-weight: bold;
        }

        .texto-cursiva {
            font-style: italic;
        }

        img {
            width: 400px;
            border: 3px solid black;
        }

        video {
            width: 500px;
            margin-top: 10px;
        }

        a {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- TÍTULO CENTRADO Y DE COLOR NEGRO -->
    <h1>Mi primera página web</h1>

    <!-- TEXTO CON FORMATO -->
    <h2>Bienvenidos a mi página</h2>

    <p>
        <strong>Mi nombre es Justin Garcia Y</strong>
        Estoy aprendiendo a crear páginas utilizando
        <b>HTML</b> y <i>CSS</i>.
    </p>


    <!-- IMAGEN -->
    <h2>Mi imagen</h2>

    <img src="Paramimaestra.jpg" alt="Imagen de mi página">


    <!-- ENLACE A OTRA PÁGINA -->
    <h2>Enlace a otra página</h2>

    <p>
        Puedes visitar otra página haciendo clic aquí:
    </p>

    <a href="https://www.youtube.com/watch?v=TPi3wu8t4GE&list=RDTPi3wu8t4GE&start_radio=1">
        Visitar youtube
    </a>


    <!-- CONTENIDO MULTIMEDIA -->
    <h2>Contenido multimedia</h2>

    <p>
        A continuación se muestra un video:
    </p>

    <video controls>
        <source src="Videoguaradado.mp4" type="video/mp4">
        Tu navegador no puede reproducir este video.
    </video>


    <!-- AUDIO -->
    <h2>Audio</h2>

    <audio controls>
        <source src="Malumabaybe.mp3" type="audio/mpeg">
        Tu navegador no puede reproducir este audio.
    </audio>

</body>

</html>
